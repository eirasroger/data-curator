name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only, explicitly. Without this the job gets whatever the repository
# default is, which on a public repo can be a token that may write to it - far
# more than checkout, pip and pytest need.
permissions:
  contents: read

# A new push supersedes the run it interrupted; there is no reason to pay for
# both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the containers run. 3.14 is what development happens on.
        # Anything that only breaks on one of them is worth knowing about.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Tests
        run: pytest

      # The committed figures are generated from a decision history that is not
      # in the repo (it is gigabytes-adjacent and regenerable), so CI cannot
      # rebuild them. It can prove the analysis still runs end to end, which is
      # what breaks silently when a column is renamed.
      # Credential-free and network-free once the provider is cached: fmt and
      # validate check syntax and provider schemas without touching GCP, so CI
      # never authenticates and never spends anything.
      # The stub provider, so this costs nothing and needs no key. Two gates:
      # any unsafe apply fails the build whatever the accuracy, and accuracy
      # below the committed baseline fails it as a regression. Baseline is
      # eval/results.json; raise it when a change earns it.
      - name: Eval gate
        run: python eval/run_eval.py --min-accuracy 0.90

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Terraform
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

      - name: Analysis pipeline
        run: |
          python scripts/seed_local.py --db ci.duckdb --replace
          python sim/run.py --db ci.duckdb --count 200 --days 14
          python analysis/report.py --db ci.duckdb --drift-db ci.duckdb             --figures ci-figures --out ci-summary.json
