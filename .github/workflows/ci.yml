name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token.
permissions:
  contents: read

# A new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 matches the containers; 3.14 matches local development.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Tests
        run: pytest

      # Offline scorer: fails on any unsafe apply or accuracy below 0.90.
      - name: Eval gate
        run: python eval/run_eval.py --min-accuracy 0.90

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      # Syntax and schema checks only; no GCP credentials needed.
      - name: Terraform
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

      # Checks the analysis runs end to end on a small simulated history.
      - name: Analysis pipeline
        run: |
          python scripts/seed_local.py --db ci.duckdb --replace
          python sim/run.py --db ci.duckdb --count 200 --days 14
          python analysis/report.py --db ci.duckdb --drift-db ci.duckdb             --figures ci-figures --out ci-summary.json
