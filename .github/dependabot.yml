# Weekly dependency updates, grouped into one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: pip
    # These files pin the same versions, so they update together.
    directories:
      - /
      - /services/api
      - /services/dashboard
      - /services/webhook
      - /services/worker
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
