[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-curator"
version = "0.1.0"
description = "Change management for a corpus of Environmental Product Declarations."
readme = "README.md"
requires-python = ">=3.12"

# Keep in sync with services/*/requirements.txt, which the Dockerfiles use.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "google-cloud-pubsub==2.41.0",
    "google-cloud-bigquery==3.45.2",
    "jinja2==3.1.6",
    "openai==3.16.2",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "python-dotenv==1.2.3",
    "duckdb==1.5.5",
    # duckdb needs it to hand a TIMESTAMPTZ back to Python.
    "pytz==2026.3.post1",
    "matplotlib==3.11.2",
    "ruff==0.16.8",
    "mypy==2.3.1",
]

[tool.setuptools]
packages = ["domain", "domain.providers", "domain.stores", "sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py312"
extend-exclude = [".venv", "seed"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# UP042 (StrEnum) would change what str(member) returns in stored data and logs.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# schema.py keeps one field per line.
"domain/schema.py" = ["E501"]

[tool.mypy]
# domain/ only; services and scripts are thin wrappers.
files = ["domain"]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
